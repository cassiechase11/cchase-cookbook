<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cookbook</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf9f7;color:#1a1a1a;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* Cover */
  .cover{text-align:center;padding:4rem 2rem 3rem;background:#fff;border-bottom:1px solid #e8e5e0}
  .cover-ornament{font-size:56px;margin-bottom:1rem;display:block}
  .cover h1{font-size:2.8rem;font-weight:400;letter-spacing:-1px;margin-bottom:0.5rem;color:#1a1a1a}
  .cover p{font-size:1rem;color:#888;font-style:italic}

  /* Nav */
  .nav{display:flex;gap:8px;flex-wrap:wrap;padding:1rem 1.5rem;background:#fff;border-bottom:1px solid #e8e5e0;position:sticky;top:0;z-index:10}
  .nav-btn{font-size:13px;padding:6px 16px;border:1px solid #ddd;border-radius:20px;cursor:pointer;background:#fff;color:#444;transition:all 0.15s;font-family:inherit}
  .nav-btn:hover{background:#f5f3f0;border-color:#bbb}
  .nav-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

  /* Recipe grid */
  .recipe-grid{display:flex;flex-direction:column;border-top:1px solid #e8e5e0}
  .recipe-card{background:#fff;padding:1rem 1.6rem;cursor:pointer;border-bottom:1px solid #e8e5e0;transition:background 0.1s;display:flex;align-items:center;gap:1rem}
  .recipe-card:hover{background:#faf9f7}
  .recipe-card-text{flex:1}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:12px;font-weight:500;letter-spacing:0.3px;white-space:nowrap;flex-shrink:0}
  .tag-apps{background:#e1f5ee;color:#0a6b50}
  .tag-bread{background:#faeedd;color:#7a4a08}
  .tag-totry{background:#f0ebfb;color:#5b2d8e}
  .tag-breakfast{background:#faeae7;color:#8f3920}
  .tag-mains{background:#e6f1fb;color:#155a9e}
  .tag-dessert{background:#fbeaf0;color:#8f2e54}
  .recipe-card h3{font-size:15px;font-weight:500;color:#1a1a1a;margin-bottom:2px;line-height:1.4}
  .recipe-card p{font-size:13px;color:#888}
  .recipe-card-img{width:72px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0}

  /* Detail view */
  .detail{display:none}
  .detail.visible{display:block}
  .index.hidden{display:none}

  .detail-header{padding:2rem 1.8rem 1.6rem;background:#fff;border-bottom:1px solid #e8e5e0;display:flex;align-items:flex-start;gap:1rem}
  .back-btn{font-size:13px;padding:6px 14px;border:1px solid #ddd;border-radius:8px;cursor:pointer;background:#fff;color:#666;font-family:inherit;white-space:nowrap;margin-top:3px;transition:background 0.1s}
  .back-btn:hover{background:#f5f3f0}
  .detail-header-text h2{font-size:1.7rem;font-weight:400;color:#1a1a1a;margin-bottom:5px;letter-spacing:-0.5px;line-height:1.2}
  .detail-header-text p{font-size:13px;color:#888}

  .detail-body{display:grid;grid-template-columns:1fr 1.7fr}
  .ingredients-col{padding:1.8rem;background:#faf9f7;border-right:1px solid #e8e5e0;min-width:0}
  .instructions-col{padding:1.8rem;background:#fff;min-width:0}
  .col-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:1.2rem}

  .ingredient-group{margin-bottom:1.2rem}
  .ingredient-group .group-name{font-size:12px;font-weight:600;color:#888;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #e8e5e0;text-transform:uppercase;letter-spacing:0.5px}
  .ingredient-item{font-size:14px;color:#333;padding:4px 0;line-height:1.5;display:flex;align-items:flex-start;gap:10px}
  .ingredient-item::before{content:"";display:block;width:4px;height:4px;border-radius:50%;background:#ccc;margin-top:9px;flex-shrink:0}

  .step{display:flex;gap:14px;margin-bottom:1.4rem}
  .step-num{font-size:12px;font-weight:600;color:#999;background:#f5f3f0;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .step-text{font-size:14px;color:#333;line-height:1.65}

  .note{font-size:13px;color:#777;font-style:italic;padding:1.2rem 1.8rem;border-top:1px solid #e8e5e0;background:#fffdf9}

  /* Source badge */
  .source-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#888;padding:2px 8px;border:1px solid #e8e5e0;border-radius:10px;margin-left:8px;vertical-align:middle}

  @media(max-width:600px){
    .cover h1{font-size:2rem}
    .detail-body{grid-template-columns:1fr}
    .ingredients-col{border-right:none;border-bottom:1px solid #e8e5e0}
  }
</style>
</head>
<body>

<div class="cover">
  <span class="cover-ornament">🍽️</span>
  <h1>The Cookbook</h1>
</div>

<div class="nav" id="nav">
  <button class="nav-btn active" onclick="filterCat('all')">All recipes</button>
  <button class="nav-btn" onclick="filterCat('apps')">Apps, salads &amp; sides</button>
  <button class="nav-btn" onclick="filterCat('breakfast')">Breakfast &amp; brunch</button>
  <button class="nav-btn" onclick="filterCat('mains')">Mains</button>
  <button class="nav-btn" onclick="filterCat('dessert')">Dessert</button>
  <button class="nav-btn" onclick="filterCat('bread')">Bread</button>
  <button class="nav-btn" onclick="filterCat('totry')">To Try ✦</button>
</div>

<div class="index" id="index">
  <div id="recipe-list" class="recipe-grid"></div>
</div>

<div class="detail" id="detail">
  <div class="detail-header">
    <button class="back-btn" onclick="showIndex()">← All recipes</button>
    <div class="detail-header-text">
      <h2 id="d-title"></h2>
      <p id="d-meta"></p>
    </div>
  </div>
  <div class="detail-body">
    <div class="ingredients-col">
      <div class="col-label">Ingredients</div>
      <div id="d-ingredients"></div>
    </div>
    <div class="instructions-col">
      <div class="col-label">Instructions</div>
      <div id="d-steps"></div>
    </div>
  </div>
  <div id="d-note" class="note" style="display:none"></div>
</div>

  {id:1,cat:'apps',title:"Anna's spring salad",by:"Anna Chase",
    ingredients:[
      {group:"Salad",items:["2 heads romaine lettuce, chopped","1 pkg sliced almonds","11oz can mandarin oranges, drained","2 celery stalks, chopped","1 yellow onion, diced"]},

    ],
    steps:["Sauté almonds in 1 Tbsp oil, adding 2–3 Tbsp sugar and stirring constantly until light golden brown. Remove from heat.","Combine dressing ingredients in a small blender. Pulse until parsley is chopped and mixture is emulsified.","Toss lettuce with dressing and serve into bowls. Top with celery, onion, mandarin oranges, and almonds."]
  },
  {id:2,cat:'apps',title:"Cranberry applesauce",by:"Tricia Chase",
    ingredients:[{group:"",items:["4 large apples (1.5–2 lbs)","1½–2 cups whole cranberries","¾ cup water","1 cup sugar","½ tsp cinnamon","⅛ tsp cloves"]}],
    steps:["Peel, core, and slice the apples. Place in a heavy saucepan with cranberries and water. Cook covered over medium heat until soft.","Add sugar, cinnamon, and cloves. Simmer uncovered, stirring often, until sugar is dissolved and flavors are blended.","Serve chilled."]

  {id:3,cat:'apps',title:"Cheese-stuffed mini peppers",by:"Valorie Chase",

  },
  {id:4,cat:'breakfast',title:"Spinach quiche",by:"Linda Bryant — only ever made by Grandma",
    ingredients:[{group:"",items:["1 pie crust for 9\" pie","1 Tbsp butter","2 cups heavy cream","4 eggs","¾ tsp salt","¼ lb Swiss cheese, shredded","2 Tbsp minced onion","10 oz pkg chopped spinach, thawed and drained","⅛ tsp nutmeg","⅛ tsp pepper"]}],
    steps:["Whisk cream, eggs, and salt until well blended. Add cheese and spinach.","Cook onion in butter ~5 minutes until tender. Add to cream mixture along with nutmeg and pepper.","Pour mixture into pie crust.","Bake at 425°F for 15 minutes. Reduce to 325°F and bake 35 minutes more until a knife comes out clean."]

  {id:5,cat:'breakfast',title:"Ton's pancakes",by:"Tonia Chase, from Better Homes",serves:"12 dollar-sized or 8 four-inch pancakes",
    ingredients:[{group:"",items:["1¼ cups all-purpose flour","3 tsp baking powder","1 Tbsp sugar","½ tsp salt","1 egg, beaten","1 cup milk","2 Tbsp canola oil"]}],
    steps:["Mix together flour, baking powder, sugar, and salt.","Combine egg, milk, and oil.","Add wet to dry ingredients, stirring just until flour is moistened.","Cook on griddle to desired doneness."]
  },
  {id:6,cat:'mains',title:"Annie's shrimp scampi",by:"Anne Barnea",serves:"3–4",
    ingredients:[{group:"",items:["1 lb raw shrimp","Trader Joe's artichoke hearts, halved or quartered","2 Tbsp olive oil","2–4 Tbsp butter","1 shallot, minced","3–4 cloves garlic, minced","Juice of ½–1 lemon","Few splashes white wine (Chardonnay or Pinot Grigio)","Salt and pepper","½–1 lb fettuccine or linguine"]}],
    steps:["Cook pasta.","In a large saucepan, heat olive oil and butter over medium until butter melts.","Add shallots and garlic. Cook 2–3 minutes.","Add artichoke hearts and shrimp. Season with salt and pepper.","Add lemon juice and wine. Cook until shrimp are cooked through.","If sauce needs more moisture, add a few spoonfuls of pasta water."]
  },
  {id:7,cat:'mains',title:"White bean chili",by:"Anne Barnea & Tricia Chase",
    ingredients:[{group:"",items:["1 lb dried navy beans","5 cups chicken stock","4 Tbsp butter","1 Tbsp minced garlic","¾ cup diced onion","1½ cups chopped green chiles (fresh or canned)","1 lb boneless skinless chicken breasts, finely chopped","1 Tbsp ground cumin","1 Tbsp dried oregano","1–2 tsp black pepper","Pinch red pepper flakes","½ bunch cilantro, chopped"]}],
    steps:["Rinse beans, cover with cool water, soak 2 hours. Drain.","Place beans in large pot with chicken stock. Bring to a boil.","In a saucepan, heat butter over medium. Add garlic, onion, and chiles; sauté 5 minutes. Add to bean pot.","Add chicken, cumin, oregano, pepper, red pepper flakes, and cilantro. Lower heat and cook ~1.5 hours, stirring occasionally.","Serve with cornbread, if desired."]
  },
  {id:8,cat:'mains',title:"Khumb hara pyaz (mushrooms with spring onions)",by:"Indian Cookbook",
    ingredients:[{group:"",items:["600g button mushrooms, stalks removed, halved","150g ghee","5 green cardamom pods","1 black cardamom pod","5 cloves","1 cinnamon stick","1 bay leaf","150g boiled onion paste","25g ginger paste","25g garlic paste","1-inch fresh ginger","4 green chillies, de-seeded and chopped","1 tsp chili powder","Pinch ground mace","½ tsp ground coriander","1 cup natural plain yogurt","300g scallions","Salt"]}],
    steps:["Heat ghee in a large heavy pan over medium. Add whole spices and stir-fry 1–2 minutes.","Add boiled onion paste and stir-fry 2 minutes. Add ginger and chillies, stir-fry 30 seconds. Add chili powder, mace, and coriander, stir-fry 30 seconds.","Remove from heat and stir in yogurt. Season with salt. Return to heat.","Add 125ml water and bring to a boil. Reduce heat and simmer ~3 minutes until oil separates.","Add mushrooms and simmer 2 minutes. Add spring onions and simmer 1 minute. Adjust seasoning."]
  },
  {id:9,cat:'mains',title:"Spiced lamb kofta kebabs",by:"D'Artagnan",
    ingredients:[
      {group:"Kebabs",items:["2 lb ground lamb","2 Tbsp finely chopped flat-leaf parsley","2 Tbsp chopped dill","1 Tbsp finely chopped mint","1 Tbsp finely chopped cilantro","2 medium garlic cloves, finely chopped","1 Tbsp ground coriander","1 scant Tbsp cumin","1 tsp paprika","½ tsp ground cinnamon","Kosher salt & black pepper","Neutral oil","24 bamboo skewers, soaked 2 hrs"]},
      {group:"Yogurt sauce",items:["1 cup full-fat Greek yogurt","Zest & juice of 1 lemon","Remaining herbs from above","Salt & pepper"]},
      {group:"To serve",items:["6 Greek-style pita or naan, warmed","Arugula or baby spinach","4 Persian cucumbers, sliced","½ red onion, sliced thin"]}
    ],
    steps:["Combine parsley, dill, mint, and cilantro. Stir 2 Tbsp into yogurt with lemon zest and ~2 Tbsp juice. Season; set aside.","Combine lamb with remaining herb mixture, garlic, and all spices. Season generously. Gently mix with hands — don't overwork.","Form 12 oval-shaped patties around 2 skewers each, about 5 inches long and 1 inch thick.","Preheat oiled grill or cast-iron grill pan to high. Grill 4–5 minutes per side until internal temp reaches 135°F. Rest 5 minutes.","Warm pita. Serve 2 kebabs per pita with greens, cucumber, red onion, and a generous dollop of yogurt sauce."]
  },
  {id:10,cat:'dessert',title:"Stacey's brownies",by:"Stacey",
    ingredients:[{group:"",items:["1 cup flour","1 cup cocoa","½ tsp baking powder","½ tsp salt","½ tsp cinnamon","2 sticks butter","2 cups sugar","4 eggs","1 Tbsp vanilla"]}],
    steps:["Mix together flour, cocoa, baking powder, salt, and cinnamon.","Melt butter over low heat. Remove from heat and add sugar. Stir in eggs one at a time. Add vanilla.","Mix dry ingredients into butter mixture.","Transfer to baking dish. Bake at 350°F for 25–30 min."],
    note:"At altitude: bake in a 9×9 glass pan at 325°F for about 45 minutes."
  },
  {id:11,cat:'dessert',title:"Salted caramel",by:"Cassie Chase",
    ingredients:[{group:"",items:["200g granulated sugar","90g salted butter, room temp, cut into 6 pieces","120ml heavy cream, room temperature","1 tsp salt"]}],
    steps:["Heat sugar in a medium heavy-duty saucepan (not non-stick) over medium heat, stirring constantly until it melts into a thick amber liquid.","Immediately stir in butter until melted and combined — it will bubble rapidly. If it separates, whisk vigorously off heat until re-combined, then return to heat.","Cook 1 minute without stirring after butter is combined.","Very slowly stir in heavy cream. Allow to boil 1 minute without stirring.","Remove from heat and stir in salt. Cool before using — it thickens as it cools."]
  },
  {id:12,cat:'dessert',title:"Rum cake",by:"Family recipe",
    ingredients:[
      {group:"Cake",items:["1 cup chopped walnuts","1 box yellow cake mix","1 pkg instant vanilla pudding","4 eggs","½ cup dark rum","½ cup water","½ cup vegetable oil"]},
      {group:"Glaze",items:["¼ cup butter","½ cup white sugar","⅛ cup water","¼ cup dark rum"]}
    ],
    steps:["Preheat oven to 325°F. Grease and flour a 10-inch tube or bundt pan. Sprinkle walnuts over the bottom.","Mix together cake mix, vanilla pudding, eggs, rum, water, and oil. Pour batter over nuts.","Bake at 325°F for 1 hour. Cool and invert onto a serving plate. Prick the top.","Make glaze: melt butter, stir in water and sugar, boil 5 minutes stirring constantly. Remove from heat and stir in rum.","Drizzle and smooth glaze evenly over the top and sides of the cake."]
  },
  {id:13,cat:'dessert',title:"Biscotti",by:"Cassie Chase",
    ingredients:[{group:"",items:["1 vanilla bean, split","¾ cup granulated sugar","½ cup unsalted butter, room temp","2 eggs","2 tsp vanilla extract","2 cups all-purpose flour","1½ tsp baking powder","½ tsp fine sea salt","1¼ cups slivered almonds, coarsely chopped"]}],
    steps:["Heat oven to 325°F with rack in center.","Scrape vanilla seeds into sugar; rub together with fingers. Cream butter, then add vanilla sugar and mix until fluffy. Add eggs and vanilla. Stir in flour, baking powder, salt, and almonds.","Divide dough into 3 pieces. Shape each into a log ~1¼ inches in diameter on a parchment-lined baking sheet. Bake ~30 minutes until lightly browned.","Cool logs slightly. Slice diagonally into ½-inch pieces. Return cut-side down to baking sheet.","Bake ~15 minutes, turning once, until lightly browned. Cool on a rack. Store in an airtight container."]
  },
  {id:14,cat:'dessert',title:"Tonia's world-famous oatmeal chocolate chip cookies",by:"Tonia Chase",
    ingredients:[{group:"",items:["1½ sticks softened butter","10 Tbsp lard (130g)","¾ cup white sugar","1½ cups brown sugar","3 Tbsp molasses","3 eggs","3 Tbsp milk","3 tsp vanilla","3 cups flour","1½ tsp baking soda","¼ tsp salt","5 cups old-fashioned oats","2 cups semi-sweet chocolate chips","2 cups milk chocolate chips"]}],
    steps:["Preheat oven to 375°F.","Mix butter, lard, white sugar, brown sugar, and molasses until creamy.","Add eggs, milk, and vanilla; mix until smooth.","In a separate bowl, mix flour, baking soda, and salt. Add to wet mixture and mix until smooth.","Add oats and mix until incorporated but lumpy.","Mix in semi-sweet chips, then gently fold in milk chocolate chips.","Drop spoon-sized lumps onto parchment-lined baking sheets.","Bake 10–11 minutes."]
  },
  {id:15,cat:'dessert',title:"Baklava",by:"Family recipe",
    ingredients:[{group:"",items:["1 (16 oz) package phyllo dough","1 cup butter","1 lb chopped nuts","1 tsp ground cinnamon","1 cup water","1 cup white sugar","1 tsp vanilla extract","½ cup honey"]}],
    steps:["Preheat oven to 350°F. Butter a 9×13 pan. Toss nuts with cinnamon and set aside.","Layer 2 sheets of phyllo in pan and butter thoroughly. Repeat for 8 layers. Sprinkle 2–3 Tbsp nut mixture. Continue alternating 2 sheets + butter + nuts. Top layer should be 6–8 sheets deep.","Cut into diamonds or squares all the way to the bottom. Bake ~50 minutes until golden and crisp.","Make sauce: boil sugar and water until dissolved. Add vanilla and honey; simmer ~20 minutes.","Remove from oven and immediately spoon sauce over. Let cool."]
  },
  {id:16,cat:'dessert',title:"Rice pudding",by:"Mel & Nicole",
    ingredients:[{group:"",items:["¾ cup short-grain white rice","1½ cups milk + ½ cup milk (divided)","⅓ cup white sugar","¼ tsp salt","1 egg, beaten","1 Tbsp butter","½ tsp vanilla","Cinnamon, to taste"]}],
    steps:["Cook rice until soft and fluffy.","Combine cooked rice with 1½ cups milk, sugar, and salt. Cook over medium heat until thick and creamy.","Stir in remaining ½ cup milk and beaten egg. Cook 2 minutes more.","Remove from heat. Stir in vanilla and butter.","Season to taste with cinnamon."]
  },
  {id:17,cat:'dessert',title:"Mexican wedding cookies",by:"From the recipe collection",
    ingredients:[{group:"",items:["5 oz whole blanched almonds (1 cup) + 40 more for decorating","2 cups + 2 Tbsp all-purpose flour","¼ tsp salt","¼ tsp ground cinnamon","1 cup (2 sticks) unsalted butter, room temp","2¾ cups sifted confectioners' sugar (divided)","1 tsp pure vanilla extract","¼ tsp pure almond extract","1 large egg white, beaten"]}],
    steps:["Preheat oven to 350°F. Toast 1 cup almonds ~12 minutes. Cool.","Process toasted almonds with flour, salt, and cinnamon until finely chopped, ~1 minute.","Beat butter and 1 cup confectioners' sugar until fluffy. Add vanilla and almond extracts. Add chopped almond mixture; beat on low until dough just comes together.","Roll into twenty 1½-inch balls; flatten slightly on baking sheets. Toss 40 almonds with 1 Tbsp egg white; press 2 almonds into each cookie.","Bake until lightly browned around edges, ~25 minutes, rotating halfway. Rest until cool enough to handle.","Sift confectioners' sugar over warm cookies. Return to sheets, cool 15 minutes, then coat with sugar again."]

    ingredients:[
      {group:"Dough",items:["1¼ cups (150g) bread flour","¼ cup (28g) dry milk powder","1½ tsp table salt","2 Tbsp (25g) granulated sugar, divided","1 large egg + enough warm water to make 1 cup (227g) liquid","1½ cups (180g) all-purpose flour, plus more as needed","1¼ tsp instant yeast","1 Tbsp (14g) unsalted butter, melted"]},
      {group:"Butter block",items:["15 Tbsp (212g) unsalted butter, cool to the touch","¼ cup (30g) all-purpose flour","¼ tsp + ⅛ tsp table salt"]},
      {group:"Finish",items:["1 large egg beaten with 1 Tbsp water (egg wash)","1 Tbsp coarse sparkling sugar (optional)"]}
    ],
    steps:[
      "Make the dough: Whisk together bread flour, dry milk, salt, and 1½ Tbsp of the sugar in a bowl; set aside. In a separate bowl, whisk egg and water. Add remaining 1½ tsp sugar, the all-purpose flour, and yeast; mix until blended. Cover and set aside in a warm spot 10–15 minutes until small bubbles form.",
      "Make the butter block: Beat butter pieces with flour and salt in a stand mixer on low just until smooth — don't overwork. Spread onto plastic wrap and shape into a 4-inch square about ¾-inch thick. Refrigerate until the dough is ready.",
      "Finish the dough: Stir melted butter into the yeast mixture. Transfer to the stand mixer, add the bread flour mixture, and mix until a dough forms, under 1 minute. Knead with a dough hook for 5 minutes, adding all-purpose flour 1 Tbsp at a time if sticky, until smooth, elastic, and tacky but not sticky.",
      "Pat the dough into a 5½-inch square on lightly greased plastic wrap. Wrap and refrigerate 30 minutes. Remove the butter block 5 minutes before the dough is ready.",
      "Laminate the dough: Pat chilled dough into a 6-inch square on a lightly floured surface. Place butter block in the center at a 45° angle. Fold the dough corners over the butter, pinch the seams, and dust the top with flour.",
      "Tap the dough all over with a rolling pin to spread it, then roll into a 15×8-inch rectangle. Brush off excess flour and do a letter fold (fold one third to center, opposite third over that). This is turn 1.",
      "Rotate the dough so the 'spine' is on the left, roll again to 15×8 inches, and perform a second letter fold. Wrap and refrigerate 30 minutes.",
      "After the rest, do 2 more letter folds (spine on the left between each). Wrap well and refrigerate at least 8 hours or overnight.",
      "Shape: Grease a 9×4×4-inch Pullman loaf pan (or 9×5-inch pan). Roll dough into a 12½×18½-inch rectangle and trim edges about ¼ inch all around. Cut lengthwise into 4 strips about 3 inches wide.",
      "Brush 2 strips with egg wash and stack them. Accordion-fold the stack 3 times into a 'W' shape. Repeat with the remaining 2 strips. Place both stacks upright side by side in the pan, leaving 1–2 inches of space at each end.",
      "Brush lightly with egg wash. Cover and refrigerate 15 minutes.",
      "Proof: Place a bowl of very hot water in the oven alongside the covered pan. Proof 2–3 hours until dough fills the pan and jiggles when gently rocked.",
      "Remove pan from oven. Preheat oven to 425°F. Brush dough with remaining egg wash and sprinkle with sparkling sugar. Set pan on a baking sheet and bake 15 minutes. Cover with foil, reduce heat to 375°F, and bake 20–25 more minutes until internal temperature reaches 205°F.",
      "Turn off oven and crack the door. Leave pan inside 15–20 minutes. Turn out onto a rack and cool at least 20 minutes before slicing with a serrated knife."
    ],
    note:"Best eaten the day it's baked. For longer storage, freeze in slices and reheat in a toaster oven. Dough scraps from trimming can be baked separately as a baker's snack!"
  },
  {id:18,cat:'bread',title:"Naan bread",by:"Sundar Sundaram",
    ingredients:[{group:"",items:["2 packets active dry yeast","1 cup warm water (divided)","2 Tbsp sugar","6 cups all-purpose flour","2 tsp baking powder","2½ tsp salt","½ cup whole milk","2 eggs","4 Tbsp oil"]}],
    steps:["Mix yeast with ½ cup warm water and sugar. Let sit 20 minutes until frothy.","Mix flour, baking powder, and salt in a large bowl.","In another bowl, mix yogurt, milk, remaining ½ cup warm water, eggs, and oil. Mix yeast mixture into milk mixture.","Using dough hook, add flour mixture one cup at a time. As dough gets stretchy, add 1 Tbsp oil at a time until correct consistency. In the last 3 seconds of mixing, add ½ Tbsp oil."],
    note:"UNPLUG THE MIXER FOR SAFETY!"
  },
  {id:19,cat:'bread',title:"Pickle biscuits",by:"Food & Wine",
    ingredients:[{group:"",items:["3½ cups all-purpose flour (422g)","2 Tbsp cornstarch","2 tsp baking powder","½ tsp baking soda","1 cup unsalted butter, cut into ½-inch cubes","3 oz sharp yellow cheddar, shredded","¾ cup chopped dill pickles + ⅓ cup cold brine","3 Tbsp finely chopped fresh dill","½ cup sour cream","½ cup whole milk","1 large egg, beaten"]}],
    steps:["Preheat oven to 425°F. Whisk flour, cornstarch, baking powder, salt, garlic powder, and baking soda. Cut in butter until crumbly and pea-sized. Stir in cheese, pickles, and dill.","Whisk sour cream, milk, and pickle brine; stir into flour mixture just until combined. Press and fold into a rough, shaggy dough.","Turn onto lightly floured surface. Pat into a 12×5.5-inch rectangle. Fold and pat twice; roll to ¾-inch thickness.","Cut with a floured 2½-inch round cutter, re-rolling scraps. Place on parchment-lined baking sheet. Freeze uncovered ~15 minutes until slightly firmed.","Brush with beaten egg. Bake 20–25 minutes until golden."],
    note:"Any pickled vegetable works — pickled jalapeños are especially good. Unbaked biscuits can be frozen and baked directly from frozen, adding 5–8 minutes."

    ingredients:[
      {group:"Cake",items:["¾ cup all-purpose flour (3¼ oz)","1¼ tsp baking powder","¼ tsp kosher salt","4 large eggs, separated, at room temperature","¾ cup granulated sugar, divided","¼ cup whole milk","¾ tsp vanilla extract"]},
      {group:"Tres leches soak",items:["1 (14-oz) can sweetened condensed milk","1 (13.5-oz) can unsweetened coconut milk","1 (12-oz) can evaporated milk"]},
      {group:"Rhubarb compote",items:["3 cups frozen cut rhubarb","½ cup granulated sugar","1 tsp grated lemon zest + 2 Tbsp fresh lemon juice","Pinch kosher salt"]},
      {group:"To serve",items:["Whipped cream","Hibiscus powder (optional), for garnish"]}
    ],
    steps:["Preheat oven to 350°F. Grease a 9×13-inch baking dish. Whisk together flour, baking powder, and salt in a bowl; set aside.","Beat egg yolks with ½ cup sugar in a stand mixer until pale and thick, about 3 minutes. Mix in milk and vanilla.","In a clean bowl, beat egg whites to soft peaks. Gradually add remaining ¼ cup sugar and beat to stiff, glossy peaks. Fold egg whites into yolk mixture in two additions, then gently fold in flour mixture until just combined.","Pour batter into prepared pan and bake 20–25 minutes until golden and a toothpick comes out clean. Let cool completely in pan.","Make the compote: combine rhubarb, sugar, lemon zest, lemon juice, and salt in a saucepan over medium heat. Cook, stirring occasionally, until rhubarb is very soft and jammy, about 15 minutes. Let cool.","Whisk together condensed milk, coconut milk, and evaporated milk. Poke holes all over the cooled cake with a skewer or fork. Slowly pour the three-milk mixture evenly over the cake. Refrigerate at least 2 hours or overnight to soak.","Spread whipped cream over the top. Spoon rhubarb compote over the cream. Dust with hibiscus powder if using. Serve chilled."],
    note:"The soaking liquid will seem like a lot — pour it slowly and let it absorb. Refrigerating overnight gives the best texture."
  },
  {id:22,cat:'dessert',title:"Cranberry curd pie",by:"Bon Appétit",
    ingredients:[
      {group:"Crust",items:["5 oz gingersnaps","1 cup walnuts or pecans","3 Tbsp brown sugar","4 Tbsp butter, melted"]},
      {group:"Filling",items:["12 oz bag fresh cranberries (frozen works too)","1½ cups sugar, divided","3 large eggs","2 egg yolks","Pinch of salt","½ cup fresh lemon juice","4 Tbsp (½ stick) unsalted butter, room temp, cut into pieces"]},
      {group:"Garnish",items:["Sugared cranberries","Fresh thyme sprigs or mint leaves"]}
    ],
    steps:["Preheat oven to 350°F. Lightly spray a 9-inch pie plate with cooking spray.","Process gingersnaps in a food processor until fine crumbs (about a heaping cup). Add walnuts and sugar; process until finely ground. Add melted butter and pulse to combine. Pat crust into pie plate and up the sides. Bake 10–12 minutes. Set aside to cool.","Simmer cranberries, 1 cup sugar, and ¼ cup water in a saucepan over medium heat for about 15 minutes until berries have popped and mixture is thick. Cool slightly, then puree until completely smooth.","Whisk the puree, eggs, yolks, salt, lemon juice, and remaining ½ cup sugar in a saucepan over medium heat. Cook, stirring constantly, until the mixture thickens and coats the back of a spoon, about 10 minutes. Let it just come to a bubble, then remove from heat.","Push the curd through a mesh strainer using the back of a spoon.","Let curd cool a few minutes, then add the room-temperature butter piece by piece, stirring to melt each addition.","Pour curd into the cooled pie crust and smooth evenly. Chill until firm, about 2 hours.","Decorate with sugared cranberries and thyme or mint if desired."],
    note:"Use graham crackers or plain chocolate wafers in place of gingersnaps. Omit walnuts for a nut-free crust — just add more crumbs. To make sugared cranberries: roll damp cranberries in granulated sugar and let dry."
  },
  {id:20,cat:'bread',title:"Buttery pull-apart garlic knots",by:"Daniel Humm / Food & Wine",serves:"10",
    ingredients:[
      {group:"Knots",items:["1 cup whole milk, room temp","1 large egg, beaten","1 (¼ oz) pkg active dry yeast","4 cups all-purpose flour (about 17 oz)","1½ Tbsp granulated sugar","4 tsp kosher salt","½ cup unsalted butter, cubed and softened","¼ cup finely grated Parmigiano-Reggiano + more for garnish","Finely chopped flat-leaf parsley, for garnish"]},
      {group:"Garlic butter",items:["¾ cup unsalted butter","⅓ cup garlic cloves, finely chopped"]}
    ],
    steps:["Whisk milk, egg, and yeast in a stand mixer with dough hook. Add flour, sugar, and salt; beat on low 1–2 minutes. Gradually add softened butter a few cubes at a time, beating 7–9 minutes total. Beat until smooth and elastic, 3–4 more minutes.","Transfer to a greased bowl; cover and proof in a warm place until doubled, 1.5–2 hours.","Make garlic butter: melt butter over low. Add garlic; cook until golden brown, 10–12 minutes. Strain — reserve garlic and strained butter separately.","Cut dough into ~30 (1 oz) pieces. Roll each into an 8-inch rope; tie into a knot. Roll knots in strained butter; arrange in a 12-inch cast-iron skillet or 13×9 pan. Add reserved garlic to remaining butter; set aside.","Preheat oven to 375°F. Sprinkle knots with Parmigiano-Reggiano; cover and proof until almost doubled, 35–45 minutes.","Uncover; bake until golden and internal temp reaches 190°F, 25–30 minutes. Brush with reserved garlic butter; garnish with cheese and parsley."],
    note:"Make ahead: prepare through step 4, refrigerate overnight. Proof 45–55 minutes before baking."
  },

  {id:34,cat:'mains',title:"Greek yogurt marinated chicken",by:"Bites with Bri",serves:"4",
    ingredients:[{group:"",items:["¾ cup plain Greek yogurt","¼ cup olive oil","3 Tbsp apple cider vinegar","Juice of 1 lemon","2 small shallots","10–12 cloves garlic","1 Tbsp smoked paprika","1 Tbsp dried oregano","1 Tbsp cumin","1 tsp turmeric","½ tsp dill weed","½ tsp cayenne pepper","2 tsp kosher salt","1 tsp black pepper","2½ lbs boneless skinless chicken thighs"]}],
    steps:["Add all marinade ingredients (everything except chicken) to a food processor. Pulse until smooth.","Place chicken thighs in a zip-top bag. Pour marinade over chicken, seal tightly, and massage until fully coated. Marinate 2–12 hours in the refrigerator.","Preheat oven to 450°F. Line a baking sheet with parchment paper. Place chicken in a single layer, shaking off excess marinade.","Bake 25–30 minutes until cooked through. Broil on high 2–3 minutes until slightly charred."],
    note:"Great for meal prep — slice over salads, wraps, or grain bowls. Chicken thighs stay juicier than breasts; if using breasts, pull them at 160°F and rest before slicing. Marinate at least 2 hours but no more than 12."
  },
  {id:35,cat:'mains',title:"Peanut ginger tofu sandwich",by:"Justine Doiron / Justine Snacks",serves:"4",
    ingredients:[
      {group:"Peanut ginger dressing",items:["Juice of 2 limes","2 Tbsp seasoned rice vinegar","2 heaping Tbsp white miso","2 Tbsp honey","1 Tbsp peanut butter","2 garlic cloves","1 Thai chili (or ¼ tsp red pepper flakes)","1 knob fresh ginger","¼ cup olive oil","2 Tbsp water","¼ tsp kosher salt"]},
      {group:"Slaw",items:["¼ head cabbage, shredded","2 carrots, shredded","½ red onion, shredded"]},
      {group:"Tofu & sandwich",items:["1 (14–16 oz) block extra-firm tofu","¼ cup all-purpose flour","¼ tsp salt","4 hoagie rolls or baguette sections","Fresh mint and cilantro, for serving","2 eggs, fried or jammy (optional)"]}
    ],
    steps:["Preheat oven to 400°F convection (or 425°F standard).","Blend all dressing ingredients until very smooth. Taste and adjust salt. Set aside.","Toss shredded cabbage, carrots, and red onion in a large bowl. Pour half the dressing over the slaw and toss. Set aside to marinate.","Drain tofu and press dry with paper towels. Cut crosswise into 4 large rectangular strips (1 inch thick), or 8 squares.","Pour ¼ cup of the remaining dressing into a shallow dish. In a separate dish, whisk flour and salt. Dip each tofu piece in the dressing, then dredge in the flour.","Arrange on a parchment-lined baking sheet. Bake 25–30 minutes, flipping halfway, until golden and crisp.","Assemble: split rolls and load with slaw, tofu, fresh herbs, and a drizzle of remaining dressing. Top with a fried or jammy egg if you like."],
    note:"Inspired by the tofu bánh mì from Radio Bakery in Brooklyn. Peanut butter can be swapped for almond butter, tahini, or sunflower seed butter. Thai chili can be swapped for serrano or jalapeño."
  },

  {id:36,cat:'totry',title:"Mexican street corn cornbread",by:"King Arthur Baking",
    ingredients:[
      {group:"Batter",items:["4 Tbsp (57g) unsalted butter","½ cup + 2 Tbsp (75g) all-purpose flour","½ cup (78g) yellow cornmeal","1 tsp baking powder","½ tsp baking soda","¾ cup (170g) mayonnaise","¼ cup (50g) granulated sugar","1 large egg","½ cup (50g) aged Cotija cheese, finely crumbled (divided)","⅓ cup (50g) corn, fresh or thawed from frozen (divided)","2 Tbsp fresh cilantro, minced (divided)"]},
      {group:"Crema",items:["3 Tbsp mayonnaise","2 Tbsp sour cream","Zest of ½ lime + 2 tsp lime juice","¼ tsp smoked paprika, plus more for sprinkling"]}
    ],
    steps:["Preheat oven to 350°F with rack in center. Place butter in an 8-inch round pan and transfer to the oven to melt, about 5 minutes.","Whisk together flour, cornmeal, baking powder, and baking soda in a medium bowl.","In a large bowl, whisk together mayonnaise, sugar, and egg until smooth. Add dry ingredients and whisk until fully combined.","Reserve 2 Tbsp Cotija, 2 Tbsp corn, and 1 Tbsp cilantro for topping. Stir the rest into the batter.","Carefully remove the pan from the oven. Dollop batter into the pan and spread evenly — some butter will pool on top, that's fine. Bake 20–25 minutes until golden and an instant-read thermometer reads 205°F.","Whisk together crema ingredients. While cornbread is still slightly warm, spread about 3 Tbsp crema over the top. Sprinkle with reserved Cotija, corn, and cilantro. Drizzle remaining crema and dust with smoked paprika."],
    note:"Best eaten the day it's baked. Cotija can be swapped for feta. Can also be baked in a 9-inch pan or 10-inch cast iron skillet — reduce baking time to 18–20 minutes."
  },
  {id:30,cat:'totry',title:"Baked coconut red lentils and greens",by:"Ashley Lonsdale / NYT Cooking",serves:"4–6",
    ingredients:[{group:"",items:["3 Tbsp coconut oil","1½ tsp ground turmeric, divided","1 tsp ground allspice","½ tsp ground ginger","1 (14-oz) can diced tomatoes","Salt and freshly ground black pepper","3 cups vegetable or chicken stock","1 (13.5-oz) can coconut milk","1¼ cups red lentils","1 medium white onion, halved and sliced","2 serrano chiles, sliced","2 Tbsp distilled white vinegar","1 bunch fresh spinach, trimmed and chopped (or 7 oz baby spinach)"]}],
    steps:["Heat oven to 400°F.","In a Dutch oven over medium heat, heat coconut oil. Add 1 tsp turmeric, allspice, and ginger; cook 30 seconds until fragrant. Stir in diced tomatoes with juices, season with salt and pepper, and cook 3–5 minutes until jammy.","Add stock, coconut milk, and red lentils; bring to a boil over high heat. Season well. Transfer to oven uncovered and bake 20 minutes until lentils are plump and tender.","While lentils bake, make the pickled onions: toss sliced onion and chiles with vinegar, a pinch of salt, and remaining ½ tsp turmeric. Set aside.","Once lentils are done, stir in spinach in large handfuls until wilted. Return to oven 8–10 minutes until stew is slightly concentrated and lentils are falling apart.","Serve over rice with spicy pickled onion mixture on top."]
  },
  {id:31,cat:'totry',title:"Tahini ramen salad",by:"Kay Chun / NYT Cooking",serves:"4",note:"Tried June 2026 — good concept but a little too rich and creamy. Might be better with peanut butter instead of tahini for more of a peanut noodle vibe.",
    ingredients:[{group:"",items:["12 oz dry ramen noodles (four 3-oz packages, seasoning discarded)","6 Tbsp tahini","6 Tbsp extra-virgin olive oil","¼ cup distilled white vinegar","2 Tbsp minced ginger","2 Tbsp sweet miso","1 Tbsp minced garlic","Kosher salt and black pepper","1 (15-oz) can chickpeas, rinsed","4 cups thinly sliced vegetables (bell pepper, cucumbers, radishes, snap peas)","½ cup thinly sliced scallions"]}],
    steps:["Cook ramen noodles according to package directions. Drain, rinse under cold water, and drain well.","Whisk together tahini, olive oil, vinegar, ginger, miso, and garlic until smooth. Season generously with salt and pepper.","Toss noodles with dressing, chickpeas, sliced vegetables, and scallions until evenly coated.","Taste and adjust seasoning. Serve immediately or refrigerate — it holds well."]
  },
  {id:32,cat:'totry',title:"Sesame cucumber and avocado salad",by:"Hetty Lui McKinnon / NYT Cooking",serves:"4",
    ingredients:[
      {group:"Sesame dressing",items:["2 Tbsp toasted sesame oil","2 Tbsp rice vinegar","1 Tbsp toasted sesame seeds","1 Tbsp granulated sugar","1½ tsp soy sauce or tamari","½ tsp red-pepper flakes"]},
      {group:"Salad",items:["2 ripe avocados","1 lb cucumbers (Persian or English), trimmed and thinly sliced","2 scallions, trimmed and thinly sliced","Kosher salt and black pepper","Toasted sesame seeds, for topping"]}
    ],
    steps:["Whisk together all dressing ingredients in a small bowl until sugar dissolves.","Halve, pit, and slice or cube the avocados. Combine with sliced cucumbers and scallions in a serving bowl.","Drizzle dressing over salad and toss gently. Season with salt and pepper.","Top with extra sesame seeds and serve immediately."]
  },
  {id:33,cat:'totry',title:"Old Bay tofu nuggets",by:"Ali Slagle / NYT Cooking",serves:"2–4",
    ingredients:[{group:"",items:["1 (14–16 oz) block extra-firm or firm tofu","2 Tbsp hot sauce (such as Frank's)","1 Tbsp extra-virgin olive oil","2 Tbsp all-purpose flour","1 tsp Old Bay seasoning","1 tsp garlic powder","Lemon wedges, tartar sauce, ketchup or barbecue sauce, for serving"]}],
    steps:["Arrange a rack in the bottom third of the oven and heat to 425°F.","Slice tofu 1-inch thick and press very dry with a kitchen towel. Rip into roughly 1-inch pieces and transfer to a bowl. Add hot sauce and oil; toss gently.","In a small bowl, stir together flour, Old Bay, and garlic powder. Sprinkle over tofu and toss until all flour is absorbed.","Transfer to a parchment-lined sheet pan. Roast on the bottom rack 20–30 minutes until golden and crisp, flipping halfway through.","Let cool a minute or two, then serve with lemon or dipping sauce."]
  },

// ─── API call to read a Drive file and parse it as a recipe ─────────────────
async function fetchRecipeFromDriveFile(fileId, cat, fileName) {
  const prompt = `You are reading a Google Drive file containing a recipe. The file is called "${fileName}" and is in the "${cat}" category. Here is the file content:

<file_content>
{FILE_CONTENT}
</file_content>

Extract the recipe and return ONLY a valid JSON object (no markdown, no explanation) with this exact structure:
{
  "title": "Recipe name",
  "by": "Contributor name or source (e.g. 'Tonia Chase' or 'Food & Wine'). If not found, use ''.",
  "serves": "Serving size as a string, or null if not specified",
  "ingredients": [
    {
      "group": "Group name if recipe has sections like 'Cake' or 'Glaze', otherwise empty string",
      "items": ["ingredient 1", "ingredient 2"]
    }
  ],
  "steps": ["Step 1 text", "Step 2 text"],
  "note": "Any tip or note at the end, or null if none"
}

Important rules:
- If the file appears empty or has no recipe content, return {"empty": true}
- Do not include markdown code fences
- Return valid parseable JSON only`;

  // First fetch the file content via the Drive MCP
  const driveResponse = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      mcp_servers: [{
        type: "url",
        url: "https://drivemcp.googleapis.com/mcp/v1",
        name: "google-drive"
      }],
      messages: [{
        role: "user",
        content: `Read the Google Drive file with ID "${fileId}" and return its text content. Then extract the recipe as JSON per these instructions:\n\n${prompt.replace('{FILE_CONTENT}', '[file will be read by the tool]')}\n\nFile ID: ${fileId}`
      }]
    })
  });

  const data = await driveResponse.json();
  
  // Extract text content from response
  const textBlocks = data.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
  
  // Try to parse JSON from the response
  const jsonMatch = textBlocks.match(/\{[\s\S]*\}/);
  if (!jsonMatch) return null;
  
  try {
    const parsed = JSON.parse(jsonMatch[0]);
    if (parsed.empty) return null;
    return parsed;
  } catch {
    return null;
  }
}

// ─── Scan Drive folders for new files ───────────────────────────────────────
async function scanDriveFolders() {
  const newRecipes = [];

  for (const [cat, folderId] of Object.entries(DRIVE_FOLDER_IDS)) {
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          mcp_servers: [{
            type: "url",
            url: "https://drivemcp.googleapis.com/mcp/v1",
            name: "google-drive"
          }],
          messages: [{
            role: "user",
            content: `Search Google Drive for all files where parentId = '${folderId}'. List each file as JSON with fields: id, title, mimeType. Return ONLY a JSON array, no explanation.`
          }]
        })
      });

      const data = await response.json();
      const textBlocks = data.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
      const arrMatch = textBlocks.match(/\[[\s\S]*\]/);
      if (!arrMatch) continue;

      let files;
      try { files = JSON.parse(arrMatch[0]); } catch { continue; }

      for (const file of files) {
        if (SKIP_FILE_IDS.has(file.id)) continue;
        // Only process Google Docs and PDFs (skip images, folders, spreadsheets)
        if (!['application/vnd.google-apps.document', 'application/pdf'].includes(file.mimeType)) continue;

        const recipe = await fetchRecipeFromDriveFile(file.id, cat, file.title);
        if (!recipe) continue;

        newRecipes.push({
          id: nextId++,
          cat,
          title: recipe.title || file.title,
          by: recipe.by || '',
          serves: recipe.serves || undefined,
          ingredients: recipe.ingredients || [{group:'', items:[]}],
          steps: recipe.steps || [],
          note: recipe.note || undefined,
          driveFileId: file.id,
          driveFileName: file.title,
        });
      }
    } catch (err) {
      console.warn(`Error scanning folder ${cat}:`, err);
    }
  }

  return newRecipes;
}

// ─── UI helpers ─────────────────────────────────────────────────────────────
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function renderList() {
  const list = document.getElementById('recipe-list');
  const filtered = currentCat === 'all' ? allRecipes : allRecipes.filter(r => r.cat === currentCat);
  
  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding:2rem 1.8rem;color:#888;font-size:14px;">No recipes in this category yet.</div>';
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="recipe-card" onclick="showRecipe(${r.id})">
      ${r.photo ? `<img class="recipe-card-img" src="${r.photo}" alt="${r.title}">` : ''}
      <div class="recipe-card-text">
        <h3>${cap(r.title)}${r.driveFileId ? '<span class="source-badge">📁 Drive</span>' : ''}</h3>
        <p>${r.by || ''}${r.serves ? ' · Serves ' + r.serves : ''}</p>
      </div>
      <span class="tag tag-${r.cat}">${catLabels[r.cat]}</span>
    </div>`).join('');
}

function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    const cats = ['all','apps','breakfast','mains','dessert','bread'];
    b.classList.toggle('active', cats[i] === cat);
  });
  renderList();
  showIndex();
}

function showIndex() {
  document.getElementById('index').classList.remove('hidden');
  document.getElementById('detail').classList.remove('visible');
  document.getElementById('nav').style.display = 'flex';
  window.scrollTo(0, 0);
}

function showRecipe(id) {
  const r = allRecipes.find(x => x.id === id);
  if (!r) return;

  document.getElementById('d-title').textContent = cap(r.title);
  document.getElementById('d-meta').textContent = (r.by || '') + (r.serves ? ' · Serves ' + r.serves : '') + (r.driveFileId ? '  ·  From Google Drive' : '');

  document.getElementById('d-ingredients').innerHTML = r.ingredients.map(g => `
    <div class="ingredient-group">
      ${g.group ? `<div class="group-name">${g.group}</div>` : ''}
      ${g.items.map(i => `<div class="ingredient-item">${i}</div>`).join('')}
    </div>`).join('');

  document.getElementById('d-steps').innerHTML = r.steps.map((s, i) => `
    <div class="step">
      <div class="step-num">${i + 1}</div>
      <div class="step-text">${s}</div>
    </div>`).join('');

  const noteEl = document.getElementById('d-note');
  if (r.note) { noteEl.textContent = r.note; noteEl.style.display = 'block'; }
  else { noteEl.style.display = 'none'; }

  document.getElementById('index').classList.add('hidden');
  document.getElementById('detail').classList.add('visible');
  document.getElementById('nav').style.display = 'none';
  window.scrollTo(0, 0);
}
